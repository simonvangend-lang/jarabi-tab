<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarabi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jarabi — Tab Scroller</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a; color: #e0e0e0;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    overflow: hidden; user-select: none;
  }
  #controls {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 16px; background: #111;
    border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap;
  }
  h1 { font-size: 14px; font-weight: 600; color: #ccc; white-space: nowrap; }
  .cg { display: flex; align-items: center; gap: 6px; }
  label { font-size: 12px; color: #888; white-space: nowrap; }
  input[type=range] { width: 100px; accent-color: #e8a020; cursor: pointer; }
  .val { font-size: 12px; color: #e8a020; min-width: 36px; }
  button {
    padding: 5px 15px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: background .12s;
  }
  #btn-play { background: #e8a020; color: #111; }
  #btn-play:hover { background: #f0b030; }
  #btn-play:disabled { background: #555; color: #888; cursor: default; }
  #btn-reset { background: #333; color: #ccc; }
  #btn-reset:hover { background: #444; }
  #btn-loop { background: #333; color: #ccc; }
  #btn-loop:hover { background: #444; }
  #btn-loop.active { background: #c04000; color: #fff; }
  #btn-edit { background: #333; color: #ccc; }
  #btn-edit:hover { background: #444; }
  #btn-edit.active { background: #1a5fa8; color: #fff; }
  .dur-btn { padding: 3px 7px; border: 1px solid #bbb; border-radius: 4px; cursor: pointer;
             font-size: 15px; line-height: 1; background: #eee; color: #333; }
  .dur-btn.active { background: #1a5fa8; color: #fff; border-color: #1a5fa8; }
  #prog-wrap {
    flex: 1; min-width: 80px; height: 6px; background: #333;
    border-radius: 3px; cursor: pointer; position: relative;
  }
  #loop-region {
    display: none; position: absolute; top: 0; height: 100%;
    background: rgba(192,64,0,0.35); pointer-events: none; border-radius: 3px;
  }
  #prog-fill { height: 100%; width: 0%; background: #e8a020; border-radius: 3px; pointer-events: none; position: relative; z-index: 1; }
  #status { font-size: 11px; color: #666; white-space: nowrap; }
  #viewport { flex: 1; overflow: hidden; position: relative; }
  canvas { display: block; }
  #end-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(0,0,0,.5); align-items: center; justify-content: center; z-index: 20;
  }
  #end-overlay.show { display: flex; }
  #end-msg { background: #222; color: #e0e0e0; padding: 24px 36px; border-radius: 8px; text-align: center; }
  #end-msg button { margin-top: 14px; background: #e8a020; color: #111; padding: 8px 22px; }
</style>
</head>
<body>

<div id="controls">
  <h1 id="title">Jarabi</h1>
  <select id="score-picker"
          style="background:#222;color:#fff;border:1px solid #555;border-radius:4px;
                 padding:4px 8px;font-size:14px;cursor:pointer"></select>
  <button id="btn-play" disabled>▶ Play</button>
  <button id="btn-reset">↺ Reset</button>
  <div class="cg">
    <label>BPM</label>
    <input type="range" id="bpm-slider" min="30" max="220" value="80" step="1">
    <span class="val" id="bpm-val">80</span>
  </div>
  <div class="cg">
    <label>Zoom</label>
    <input type="range" id="zoom-slider" min="40" max="300" value="100" step="5">
    <span class="val" id="zoom-val">100%</span>
  </div>
  <div class="cg">
    <label>Reverb</label>
    <input type="range" id="reverb-slider" min="0" max="100" value="30" step="5">
  </div>
  <div class="cg">
    <label>Swing</label>
    <input type="range" id="swing-slider" min="0" max="100" value="30" step="5">
    <span class="val" id="swing-val">30%</span>
  </div>
  <button id="btn-loop" title="Toggle loop [L]  •  Set in [ ]  •  Set out [ ]">⟳ Loop</button>
  <button id="btn-edit">✎ Edit</button>
  <button id="btn-undo" style="display:none;background:#333;color:#ccc" disabled>↩ Undo</button>
  <button id="btn-save" style="display:none;background:#2a7a2a;color:#fff">⬇ Save</button>
  <div id="prog-wrap" title="Left-click: jump  •  Right-click: set loop out">
    <div id="loop-region"></div>
    <div id="prog-fill"></div>
  </div>
  <span id="status">Loading…</span>
</div>

<!-- Custom in-app prompt/confirm (works even when the browser is set to ignore native prompts) -->
<div id="custom-dialog" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.45);
     align-items:center;justify-content:center">
  <div style="background:#fff;padding:18px 22px;border-radius:8px;min-width:300px;font-family:sans-serif;
              box-shadow:0 10px 40px rgba(0,0,0,0.3)">
    <div id="cd-msg" style="margin-bottom:10px;font-size:14px;color:#222"></div>
    <input id="cd-input" type="text" autocomplete="off"
           style="width:100%;padding:6px 8px;font-size:15px;border:1px solid #ccc;border-radius:4px;
                  box-sizing:border-box;margin-bottom:12px">
    <div style="text-align:right">
      <button id="cd-cancel" style="padding:6px 14px;margin-right:8px;background:#eee;border:1px solid #bbb;
                                    border-radius:4px;cursor:pointer">Cancel</button>
      <button id="cd-ok"     style="padding:6px 14px;background:#1a5fa8;color:#fff;border:none;
                                    border-radius:4px;cursor:pointer">OK</button>
    </div>
  </div>
</div>

<div id="viewport">
  <canvas id="canvas"></canvas>
  <div id="edit-popup" style="display:none;position:absolute;z-index:10;display:none;align-items:center;gap:4px">
    <input id="fret-input" type="number" min="0" max="22" step="1"
      style="width:52px;padding:4px 6px;font-size:16px;font-weight:bold;
             font-family:monospace;border:2px solid #e8a020;border-radius:4px;
             background:#fff;text-align:center">
    <button class="dur-btn" data-dur="q" title="Quarter note">♩</button>
    <button class="dur-btn" data-dur="e" title="Eighth note">♪</button>
    <button class="dur-btn" data-dur="s" title="Sixteenth note">♬</button>
    <button class="dur-btn" data-dur="t" title="Triplet">3</button>
    <button id="btn-hammer" class="dur-btn" title="Toggle hammer-on / pull-off (slur to previous note on same string)" style="font-family:serif;font-style:italic">H</button>
    <button id="btn-del-note"
      style="padding:4px 8px;background:#c04000;color:#fff;border:none;
             border-radius:4px;cursor:pointer;font-size:14px;line-height:1"
      title="Delete note">✕</button>
  </div>
  <div id="end-overlay">
    <div id="end-msg">End of tab<br>
      <button onclick="doReset()">↺ Start over</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
function cursorX() { return canvas.width / 2; }
const MEASURE_W  = 200;   // virtual px per measure at zoom=1
const N_STRINGS  = 6;
const STRING_H   = 22;    // virtual px between string lines (zoom=1)
const STAFF_H    = (N_STRINGS - 1) * STRING_H;  // 110px
const NOTE_FONT  = 13;    // base font size for fret numbers
const BEATS_PER_MEASURE = 4;

// Colours
const BG        = '#f7f3ec';
const STAFF_COL = '#111';
const BAR_COL   = '#111';
const NOTE_COL  = '#000';
const ACTIVE_COL= '#c04000';   // note under cursor
const CURSOR_COL= 'rgba(230,140,20,0.75)';

// ── State ────────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const viewport = document.getElementById('viewport');

let notes        = [];     // from notes.json
let stems        = [];     // all rhythmic beat positions
let beams        = [];     // pairs {beat, beat_end} for beam bars
let noteStemSet  = null;   // Set of stem beats that have a note (×8 resolution)
let totalMeasures= 0;
let totalBeats   = 0;
let zoom         = 1.0;
let scrollOffset = 0;      // virtual px from start (zoom=1)
let playing      = false;
let audioReady   = false;
let animId       = null;

let sampler   = null;
let reverb    = null;
let notePart  = null;

let loopEnabled   = false;
let loopStartBeat = 0;
let loopEndBeat   = 0;

// Edit mode
let editMode         = false;
let selectedNote     = null;
let selectedStemNotes = null;   // array when a stem (not individual note) is selected
let isDirty          = false;
let undoStack        = [];
const MAX_UNDO       = 10;

// UI refs
const btnPlay    = document.getElementById('btn-play');
const bpmSlider  = document.getElementById('bpm-slider');
const bpmVal     = document.getElementById('bpm-val');
const zoomSlider = document.getElementById('zoom-slider');
const zoomVal    = document.getElementById('zoom-val');
const reverbSl   = document.getElementById('reverb-slider');
const swingSl    = document.getElementById('swing-slider');
const swingVal   = document.getElementById('swing-val');
const progWrap   = document.getElementById('prog-wrap');
const progFill   = document.getElementById('prog-fill');
const loopRegion = document.getElementById('loop-region');
const btnLoop    = document.getElementById('btn-loop');
const statusEl   = document.getElementById('status');
const endOverlay = document.getElementById('end-overlay');

// ── Geometry helpers ─────────────────────────────────────────────────────────
function measureW()  { return MEASURE_W * zoom; }
function stringH()   { return STRING_H  * zoom; }
function staffH()    { return STAFF_H   * zoom; }
function staffTop()  { return (canvas.height - staffH()) / 2; }

// Virtual x for a beat (zoom=1 space)
const BAR_PAD_FRAC = 0.0625;   // gap (fraction of MEASURE_W) visible just after each barline (symmetric around barline)
function beatToVX(beat) {
  // Continuous linear mapping (no jerk across barlines). Each beat is a fixed
  // distance from the next; the offset shifts the whole timeline rightward so
  // a visible padding appears between the barline and the first beat of each bar.
  return beat * MEASURE_W / BEATS_PER_MEASURE + MEASURE_W * BAR_PAD_FRAC;
}

// Screen x from virtual x, given current scrollOffset
function vxToSX(vx)  { return (vx - scrollOffset) * zoom + cursorX(); }

// Max scrollOffset in virtual (zoom=1) space
function maxScroll() {
  // Let the playhead travel all the way to the final beat of the piece.
  // (Music will scroll off to the left of the cursor; the area right of the
  // cursor can show empty space — that's expected at the end.)
  return Math.max(0, totalBeats * MEASURE_W / BEATS_PER_MEASURE);
}

// ── Drawing ──────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  if (!notes.length) return;

  const mW  = measureW();
  const sH  = stringH();
  const top = staffTop();

  // Update measure counter in status
  const beat = audioReady && playing ? currentBeat() : scrollBeat();
  const measure = Math.floor(beat / BEATS_PER_MEASURE) + 1;
  statusEl.textContent = `m${measure} · ${notes.length} notes · ${totalMeasures} bars`;

  // Visible virtual-x range
  const cx  = cursorX();
  const vx0 = scrollOffset - cx / zoom;
  const vx1 = scrollOffset + (W - cx) / zoom;

  // ── Staff lines ────────────────────────────────────────────────────────────
  ctx.strokeStyle = STAFF_COL;
  ctx.lineWidth   = 1;
  for (let s = 0; s < N_STRINGS; s++) {
    const y  = top + s * sH;
    const sx0 = Math.max(0,  vxToSX(vx0));
    const sx1 = Math.min(W,  vxToSX(vx1));
    ctx.beginPath();
    ctx.moveTo(sx0, y);
    ctx.lineTo(sx1, y);
    ctx.stroke();
  }

  // ── Barlines ──────────────────────────────────────────────────────────────
  const m0 = Math.max(0,             Math.floor(vx0 / (MEASURE_W)) - 1);
  const m1 = Math.min(totalMeasures, Math.ceil (vx1 / (MEASURE_W)) + 1);
  ctx.strokeStyle = BAR_COL;
  ctx.lineWidth   = 1.5;
  for (let m = m0; m <= m1; m++) {
    const sx = vxToSX(m * MEASURE_W);
    if (sx < -2 || sx > W + 2) continue;
    ctx.beginPath();
    ctx.moveTo(sx, top);
    ctx.lineTo(sx, top + staffH());
    ctx.stroke();
  }

  // ── 3+3+2 accent markers (beats 1.5 and 3.0 within each measure) ────────────
  // Faint dotted lines inside the staff to show the rhythmic grouping
  ctx.strokeStyle = 'rgba(0,0,0,0.13)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([3, 4]);
  for (let m = m0; m < m1; m++) {
    for (const accentBeat of [1.5, 3.0]) {
      const sx = vxToSX(beatToVX(m * BEATS_PER_MEASURE + accentBeat));
      if (sx < 0 || sx > W) continue;
      ctx.beginPath();
      ctx.moveTo(sx, top);
      ctx.lineTo(sx, top + staffH());
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // ── Stems ─────────────────────────────────────────────────────────────────
  const stemH  = Math.max(8, 18 * zoom);   // height above top string
  const beamH  = Math.max(2, 3.5 * zoom); // beam bar thickness
  ctx.lineWidth = Math.max(1, 1.2 * zoom);
  // Build map: stem-key (×8 resolution) → lowest string holding a note at that beat
  const stemLowest = new Map();
  for (const n of notes) {
    if (n.grace) continue;
    const k = Math.round(n.beat * 8);
    const cur = stemLowest.get(k);
    if (cur === undefined || n.string > cur) stemLowest.set(k, n.string);
  }
  const selStemKey = selectedStemNotes && selectedStemNotes.length
    ? Math.round(selectedStemNotes[0].beat * 8) : -1;
  for (const stem of stems) {
    const vx = beatToVX(stem.beat);
    if (vx < vx0 - 5 || vx > vx1 + 5) continue;
    const sx = vxToSX(vx);
    const stemKey = Math.round(stem.beat * 8);
    const isStemSel = stemKey === selStemKey;
    const hasNote   = noteStemSet && noteStemSet.has(stemKey);
    ctx.strokeStyle = isStemSel ? '#e8a020' : (hasNote ? '#444' : '#bbb');
    ctx.lineWidth   = isStemSel ? Math.max(2, 2 * zoom) : Math.max(1, 1.2 * zoom);
    // Bottom of stem: if there are notes at this beat, run the stem through the staff
    // down to the lowest note (so it visually connects to the fret number). The BG
    // rectangle drawn behind each note will mask the stem where it would cross a
    // higher fret-number, so the stem appears to "terminate" at the lowest digit.
    let bottomY = top;
    if (hasNote && stemLowest.has(stemKey)) {
      bottomY = top + stemLowest.get(stemKey) * sH;
    }
    ctx.beginPath();
    ctx.moveTo(sx, top - stemH);
    ctx.lineTo(sx, bottomY);
    ctx.stroke();
  }
  ctx.lineWidth = Math.max(1, 1.2 * zoom); // reset after loop

  // ── Beams ──────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#333';
  for (const beam of beams) {
    const sx0 = vxToSX(beatToVX(beam.beat));
    const sx1 = vxToSX(beatToVX(beam.beat_end));
    if (sx1 < -2 || sx0 > W + 2) continue;
    const lv = beam.level || 1;
    const by = top - stemH + (lv - 1) * (beamH + Math.max(2, 2 * zoom));
    ctx.fillRect(sx0, by, sx1 - sx0, beamH);
  }

  // ── Triplet "3" markers ───────────────────────────────────────────────────
  const tripletKeys = new Set(
    notes.filter(n => n.duration === 't').map(n => Math.round(n.beat * 8))
  );
  if (tripletKeys.size > 0) {
    ctx.fillStyle = '#555';
    ctx.font = `bold ${Math.max(7, 9 * zoom)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (const stem of stems) {
      if (!tripletKeys.has(Math.round(stem.beat * 8))) continue;
      const vx = beatToVX(stem.beat);
      if (vx < vx0 - 5 || vx > vx1 + 5) continue;
      ctx.fillText('3', vxToSX(vx), top - stemH - 2 * zoom);
    }
  }

  // ── Fret numbers ──────────────────────────────────────────────────────────
  const currentBeatVal = audioReady
    ? Tone.Transport.ticks / Tone.Transport.PPQ
    : scrollOffset * BEATS_PER_MEASURE / MEASURE_W;

  const fontSize = Math.max(8, NOTE_FONT * zoom);
  ctx.font      = `bold ${fontSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Group grace notes by (string, contiguous run) so we can draw slur arcs
  const graceRuns = [];   // [{string, notes: [grace notes sorted by beat]}]
  {
    const byString = new Map();
    for (const n of notes) if (n.grace) {
      if (!byString.has(n.string)) byString.set(n.string, []);
      byString.get(n.string).push(n);
    }
    for (const [s, arr] of byString) {
      arr.sort((a, b) => a.beat - b.beat);
      let run = [arr[0]];
      for (let k = 1; k < arr.length; k++) {
        if (arr[k].beat - run[run.length - 1].beat < 0.5) run.push(arr[k]);
        else { if (run.length > 1) graceRuns.push({ string: s, notes: run }); run = [arr[k]]; }
      }
      if (run.length > 1) graceRuns.push({ string: s, notes: run });
    }
  }

  for (const note of notes) {
    const vx = beatToVX(note.beat);
    if (vx < vx0 - 20 || vx > vx1 + 20) continue;

    const sx = vxToSX(vx);
    const sy = top + note.string * sH;

    // Highlight notes near the cursor
    const beatDist = Math.abs(note.beat - currentBeatVal);
    const isActive = beatDist < 0.3;

    const isGrace = !!note.grace;
    const noteFontSize = isGrace ? fontSize * 0.65 : fontSize;
    if (isGrace) ctx.font = `bold ${noteFontSize}px monospace`;

    const pad = noteFontSize * 0.35;
    const noteW = pad * 2 + 2 + (note.fret > 9 ? noteFontSize * 0.4 : 0);
    ctx.fillStyle = BG;
    ctx.fillRect(sx - pad - 1, sy - pad - 1, noteW, pad * 2 + 2);

    // Selected note gets an orange ring in edit mode
    if (editMode && note === selectedNote) {
      ctx.strokeStyle = '#e8a020';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx - pad - 3, sy - pad - 3, noteW + 4, pad * 2 + 6);
    }

    ctx.fillStyle = isActive ? ACTIVE_COL : (note === selectedNote ? '#e8a020' : NOTE_COL);
    ctx.fillText(note.fret.toString(), sx, sy);
    if (isGrace) ctx.font = `bold ${fontSize}px monospace`;
  }

  // ── Slur arcs from previous-on-same-string to hammer notes ────────────────
  for (const note of notes) {
    if (!note.hammer) continue;
    const prev = notes
      .filter(n => n.string === note.string && n.beat < note.beat
                && note.beat - n.beat < 1)   // only connect if within 1 beat (avoid huge cross-bar arcs)
      .sort((a, b) => b.beat - a.beat)[0];
    if (!prev) continue;
    const vxA = beatToVX(prev.beat);
    const vxB = beatToVX(note.beat);
    if (vxB < vx0 - 20 || vxA > vx1 + 20) continue;
    const sx0 = vxToSX(vxA);
    const sx1 = vxToSX(vxB);
    const sy = top + note.string * sH;
    const arcH = Math.max(6, 10 * zoom);
    const pad = Math.max(3, 4 * zoom);
    ctx.strokeStyle = NOTE_COL;
    ctx.lineWidth = Math.max(1.5, 2 * zoom);
    ctx.beginPath();
    ctx.moveTo(sx0 + pad, sy - arcH * 0.4);
    ctx.quadraticCurveTo((sx0 + sx1) / 2, sy - arcH * 1.4, sx1 - pad, sy - arcH * 0.4);
    ctx.stroke();
  }

  // ── Slur arcs over grace-note runs ──────────────────────────────────────────
  for (const run of graceRuns) {
    const vxA = beatToVX(run.notes[0].beat);
    const vxB = beatToVX(run.notes[run.notes.length - 1].beat);
    if (vxB < vx0 - 20 || vxA > vx1 + 20) continue;
    const sx0 = vxToSX(vxA);
    const sx1 = vxToSX(vxB);
    const sy = top + run.string * sH;
    const arcH = Math.max(4, 6 * zoom);
    ctx.strokeStyle = NOTE_COL;
    ctx.lineWidth = Math.max(1, 1.2 * zoom);
    ctx.beginPath();
    ctx.moveTo(sx0, sy + arcH * 0.6);
    ctx.quadraticCurveTo((sx0 + sx1) / 2, sy + arcH * 2.4, sx1, sy + arcH * 0.6);
    ctx.stroke();
  }

  // ── Cursor line ────────────────────────────────────────────────────────────
  ctx.strokeStyle = CURSOR_COL;
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(cursorX(), 0);
  ctx.lineTo(cursorX(), H);
  ctx.stroke();

  // ── "TAB" label at very start ──────────────────────────────────────────────
  const startSX = vxToSX(0);
  if (startSX > 10 && startSX < W - 10) {
    ctx.fillStyle = '#555';
    ctx.font = `bold ${Math.max(9, 11*zoom)}px sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('T', startSX - 6, top + sH);
    ctx.fillText('A', startSX - 6, top + 2*sH);
    ctx.fillText('B', startSX - 6, top + 3*sH);
  }

  // ── Progress bar ───────────────────────────────────────────────────────────
  const mx = maxScroll();
  progFill.style.width = (mx > 0 ? Math.min(100, scrollOffset / mx * 100) : 0) + '%';
}

// ── Data loading ─────────────────────────────────────────────────────────────
const scorePicker = document.getElementById('score-picker');
const titleEl     = document.getElementById('title');
let currentScoreId = null;
let scoreCatalogue = [];

// Choose initial score: URL hash > localStorage > first in catalogue
function pickInitialScoreId(catalogue) {
  const hash = location.hash.replace(/^#/, '');
  if (hash && catalogue.some(s => s.id === hash)) return hash;
  const saved = localStorage.getItem('jarabi.score');
  if (saved && catalogue.some(s => s.id === saved)) return saved;
  return catalogue[0]?.id;
}

async function loadScore(id) {
  if (!id) return;
  // Reset transient state so switching mid-edit doesn't leave stale data
  if (notePart) { notePart.dispose(); notePart = null; }
  audioReady = false;
  playing    = false;
  scrollOffset = 0;
  undoStack    = [];
  selectedNote = null;
  selectedStemNotes = null;
  btnPlay.disabled = true;
  btnPlay.textContent = '▶ Play';

  const data = await fetch(`scores/${id}.json`).then(r => r.json());
  notes         = data.notes;
  stems         = data.stems || [];
  beams         = data.beams || [];
  totalMeasures = data.total_measures;
  totalBeats    = totalMeasures * BEATS_PER_MEASURE;
  bpmSlider.value     = data.bpm;
  bpmVal.textContent  = data.bpm;
  noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));

  currentScoreId = id;
  localStorage.setItem('jarabi.score', id);
  history.replaceState(null, '', `#${id}`);
  const meta = scoreCatalogue.find(s => s.id === id);
  if (meta) {
    titleEl.textContent = meta.title;
    document.title = `${meta.title} — Jarabi`;
  }
  statusEl.textContent = `${notes.length} notes · ${totalMeasures} bars`;
  btnPlay.disabled = false;
  resize();
  draw();
}

(async () => {
  scoreCatalogue = (await fetch('scores/scores.json').then(r => r.json())).scores;
  scorePicker.innerHTML = scoreCatalogue.map(s =>
    `<option value="${s.id}">${s.title}${s.composer ? '  ·  ' + s.composer : ''}</option>`
  ).join('');
  scorePicker.addEventListener('change', () => loadScore(scorePicker.value));
  const initialId = pickInitialScoreId(scoreCatalogue);
  scorePicker.value = initialId;
  await loadScore(initialId);
})();

// ── Rhythm helpers ────────────────────────────────────────────────────────────
// 3+3+2 accent pattern within a 4/4 bar (eighth notes 1, 4, 7)
const ACCENT_BEATS = [0.0, 1.5, 3.0];

function noteVelocity(beatInMeasure) {
  const b = beatInMeasure;
  if (ACCENT_BEATS.some(a => Math.abs(b - a) < 0.13)) return 1.0;   // strong
  if (Math.abs((b * 2) % 1) < 0.13)                   return 0.68;  // other 8th
  return 0.48;                                                        // 16th subdivision
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function makePluckSynths(dest) {
  const resonances = [0.97, 0.965, 0.96, 0.955, 0.95, 0.945];
  return resonances.map(r =>
    new Tone.PluckSynth({ attackNoise: 3, dampening: 2000, resonance: r }).connect(dest)
  );
}

async function initAudio() {
  if (audioReady) return;
  btnPlay.disabled = true;

  try {
    statusEl.textContent = 'Loading samples…';
    await Tone.start();

    reverb = new Tone.Reverb({ decay: 2.2, wet: reverbSl.value / 100 }).toDestination();
    await reverb.ready;

    const eq = new Tone.EQ3({ low: 3, mid: -1, high: -6,
                               lowFrequency: 300, highFrequency: 3000 }).connect(reverb);

    // Quick CDN probe before committing to sampler load
    const BASE = 'https://nbrosowsky.github.io/tonejs-instruments/samples/guitar-nylon/';
    let cdnOk = false;
    try {
      const r = await Promise.race([
        fetch(BASE + 'E2.mp3', { method: 'HEAD', mode: 'no-cors' }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('probe timeout')), 4000)),
      ]);
      cdnOk = true; // no-cors always opaque-ok if server responded
    } catch { cdnOk = false; }

    let triggerNote;

    if (cdnOk) {
      // Map note names to URLs — use '#' in keys so Tone.js parses them correctly
      const NOTES = [
        ['E2','E2'], ['F#2','Fs2'], ['A2','A2'],
        ['C#3','Cs3'], ['E3','E3'], ['F#3','Fs3'],
        ['A3','A3'], ['C#4','Cs4'], ['E4','E4'],
        ['F#4','Fs4'], ['A4','A4'], ['C#5','Cs5'], ['E5','E5'],
      ];
      const urls = Object.fromEntries(NOTES.map(([k, f]) => [k, BASE + f + '.mp3']));

      const loaded = await Promise.race([
        new Promise(resolve => {
          sampler = new Tone.Sampler({ urls,
            onload:  () => resolve(true),
            onerror: () => resolve(false),
          }).connect(eq);
        }),
        new Promise(resolve => setTimeout(() => resolve(false), 10000)),
      ]);

      if (loaded) {
        triggerNote = (note, time, vel) => {
          const n = Tone.Frequency(note.midi, 'midi').toNote();
          if (note.string >= 4)
            sampler.triggerAttackRelease(n, '8n', time, vel);
          else
            sampler.triggerAttack(n, time, vel);
        };
        statusEl.textContent = `${notes.length} notes · ${totalMeasures} bars · nylon samples`;
      } else {
        sampler.dispose(); sampler = null;
      }
    }

    if (!triggerNote) {
      const synths = makePluckSynths(eq);
      triggerNote = (note, time, vel) => {
        const freq = Tone.Frequency(note.midi, 'midi').toFrequency();
        // Hammer-on / pull-off: no fresh pluck — play much softer
        const v = note.hammer ? vel * 0.35 : vel;
        if (note.string >= 4)
          synths[note.string].triggerAttackRelease(freq, '8n', time, v);
        else
          synths[note.string].triggerAttack(freq, time, v);
      };
      statusEl.textContent = `${notes.length} notes · ${totalMeasures} bars`;
    }

    Tone.Transport.bpm.value = parseInt(bpmSlider.value);
    Tone.Transport.swingSubdivision = '8n';
    Tone.Transport.swing = parseInt(swingSl.value) / 100;

    notePart = new Tone.Part(
      (time, note) => triggerNote(note, time, noteVelocity(note.beat_in_measure)),
      notes.map(note => [Math.round(note.beat * Tone.Transport.PPQ) + 'i', note]));
    notePart.start(0);

    Tone.Transport.schedule(() => {
      Tone.Transport.stop();
      playing = false;
      btnPlay.textContent = '▶ Play';
      endOverlay.classList.add('show');
    }, `0:0:${Math.round(totalBeats * 4)}`);

    audioReady = true;
  } catch (err) {
    console.error('initAudio failed:', err);
    statusEl.textContent = 'Audio error — reload and try again';
  } finally {
    btnPlay.disabled = false;
  }
}

// ── Playback ─────────────────────────────────────────────────────────────────
function currentBeat() {
  return Tone.Transport.ticks / Tone.Transport.PPQ;
}

function syncScroll() {
  if (!audioReady) return;
  const beat = currentBeat();
  scrollOffset = Math.min(maxScroll(), Math.max(0, beatToVX(beat)));
}

function animLoop() {
  if (!playing) return;
  syncScroll();
  draw();
  animId = requestAnimationFrame(animLoop);
}

async function doPlay() {
  const wasReady = audioReady;
  await initAudio();
  if (playing) return;
  if (Tone.Transport.state === 'stopped' && currentBeat() >= totalBeats - 0.5) {
    doReset(); return;
  }
  // If audio was just initialised, seek to wherever the score is scrolled to
  if (!wasReady && scrollOffset > 0) {
    Tone.Transport.ticks = Math.round(scrollBeat() * Tone.Transport.PPQ);
  }
  Tone.Transport.start();
  playing = true;
  btnPlay.textContent = '⏸ Pause';
  endOverlay.classList.remove('show');
  animId = requestAnimationFrame(animLoop);
}

function doPause() {
  Tone.Transport.pause();
  if (sampler) sampler.releaseAll();
  playing = false;
  btnPlay.textContent = '▶ Play';
  if (animId) cancelAnimationFrame(animId);
}

function doReset() {
  Tone.Transport.stop();
  if (sampler) sampler.releaseAll();
  playing = false;
  btnPlay.textContent = '▶ Play';
  scrollOffset = 0;
  draw();
  endOverlay.classList.remove('show');
  if (animId) cancelAnimationFrame(animId);
}

// ── Loop helpers ──────────────────────────────────────────────────────────────
function scrollBeat() {
  return scrollOffset * BEATS_PER_MEASURE / MEASURE_W;
}

function activeBeat() {
  return (audioReady && playing) ? currentBeat() : scrollBeat();
}

function applyLoop() {
  if (!audioReady) return;
  if (loopEnabled && loopEndBeat > loopStartBeat) {
    Tone.Transport.loop      = true;
    Tone.Transport.loopStart = `0:0:${Math.round(loopStartBeat * 4)}`;
    Tone.Transport.loopEnd   = `0:0:${Math.round(loopEndBeat   * 4)}`;
  } else {
    Tone.Transport.loop = false;
  }
}

function updateLoopUI() {
  const active = loopEnabled && loopEndBeat > loopStartBeat;
  btnLoop.classList.toggle('active', active);
  if (active) {
    const m1 = Math.floor(loopStartBeat / BEATS_PER_MEASURE) + 1;
    const m2 = Math.floor(loopEndBeat   / BEATS_PER_MEASURE) + 1;
    btnLoop.textContent = `⟳ m${m1}–m${m2}`;
    const f1 = loopStartBeat / totalBeats;
    const f2 = loopEndBeat   / totalBeats;
    loopRegion.style.left    = (f1 * 100) + '%';
    loopRegion.style.width   = ((f2 - f1) * 100) + '%';
    loopRegion.style.display = 'block';
  } else {
    btnLoop.textContent      = '⟳ Loop';
    loopRegion.style.display = 'none';
  }
}

function setLoopIn() {
  loopEnabled   = true;
  loopStartBeat = activeBeat();
  if (loopEndBeat <= loopStartBeat)
    loopEndBeat = Math.min(totalBeats, loopStartBeat + 8 * BEATS_PER_MEASURE);
  updateLoopUI(); applyLoop();
}

function setLoopOut() {
  loopEnabled = true;
  loopEndBeat = activeBeat();
  if (loopEndBeat <= loopStartBeat)
    loopStartBeat = Math.max(0, loopEndBeat - 8 * BEATS_PER_MEASURE);
  updateLoopUI(); applyLoop();
}

function toggleLoop() {
  loopEnabled = !loopEnabled;
  if (loopEnabled && loopEndBeat <= loopStartBeat) {
    // Default: 8-measure window around current position
    const cur = activeBeat();
    loopStartBeat = Math.max(0, Math.floor(cur / BEATS_PER_MEASURE) * BEATS_PER_MEASURE);
    loopEndBeat   = Math.min(totalBeats, loopStartBeat + 8 * BEATS_PER_MEASURE);
  }
  updateLoopUI(); applyLoop();
}

// ── Controls ──────────────────────────────────────────────────────────────────
btnPlay.addEventListener('click', () => playing ? doPause() : doPlay());
document.getElementById('btn-reset').addEventListener('click', doReset);
btnLoop.addEventListener('click', toggleLoop);

bpmSlider.addEventListener('input', () => {
  bpmVal.textContent = bpmSlider.value;
  Tone.Transport.bpm.value = parseInt(bpmSlider.value);
});

zoomSlider.addEventListener('input', () => {
  zoom = parseFloat(zoomSlider.value) / 100;
  zoomVal.textContent = zoomSlider.value + '%';
  draw();
});

reverbSl.addEventListener('input', () => {
  if (reverb) reverb.wet.value = reverbSl.value / 100;
});

swingSl.addEventListener('input', () => {
  swingVal.textContent = swingSl.value + '%';
  Tone.Transport.swing = parseInt(swingSl.value) / 100;
});

// Progress bar — left-click: jump (+ set loop in when loop active)
//               right-click: set loop out when loop active
progWrap.addEventListener('click', e => {
  const frac       = (e.clientX - progWrap.getBoundingClientRect().left) / progWrap.clientWidth;
  const targetBeat = frac * totalBeats;
  if (loopEnabled) { loopStartBeat = targetBeat; updateLoopUI(); applyLoop(); }
  scrollOffset = beatToVX(targetBeat);
  draw();
  if (audioReady) {
    const wasPlaying = playing;
    doPause();
    Tone.Transport.ticks = Math.round(targetBeat * Tone.Transport.PPQ);
    if (wasPlaying) { Tone.Transport.start(); playing = true; btnPlay.textContent = '⏸ Pause'; animId = requestAnimationFrame(animLoop); }
  }
});

progWrap.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!loopEnabled) return;
  const frac = (e.clientX - progWrap.getBoundingClientRect().left) / progWrap.clientWidth;
  loopEndBeat = frac * totalBeats;
  if (loopEndBeat <= loopStartBeat) loopStartBeat = Math.max(0, loopEndBeat - 8 * BEATS_PER_MEASURE);
  updateLoopUI(); applyLoop();
});

// In-app prompt/confirm (avoids the browser's native dialog, which can be disabled per-site)
const cdEl     = document.getElementById('custom-dialog');
const cdMsg    = document.getElementById('cd-msg');
const cdInput  = document.getElementById('cd-input');
const cdOk     = document.getElementById('cd-ok');
const cdCancel = document.getElementById('cd-cancel');
let _cdResolve = null;
function _cdClose(value) {
  cdEl.style.display = 'none';
  const r = _cdResolve; _cdResolve = null;
  if (r) r(value);
}
cdOk.addEventListener('click', () => _cdClose(cdInput.value));
cdCancel.addEventListener('click', () => _cdClose(null));
cdInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter')      { e.preventDefault(); _cdClose(cdInput.value); }
  if (e.key === 'Escape')     { e.preventDefault(); _cdClose(null); }
});
function customPrompt(message, defaultValue = '') {
  return new Promise(resolve => {
    cdMsg.textContent = message;
    cdInput.value = defaultValue;
    cdInput.style.display = '';
    cdEl.style.display = 'flex';
    _cdResolve = resolve;
    setTimeout(() => { cdInput.focus(); cdInput.select(); }, 0);
  });
}
function customConfirm(message) {
  return new Promise(resolve => {
    cdMsg.textContent = message;
    cdInput.style.display = 'none';
    cdEl.style.display = 'flex';
    _cdResolve = v => resolve(v !== null);   // OK→true, Cancel→false
    setTimeout(() => cdOk.focus(), 0);
  });
}

// Keyboard
document.addEventListener('keydown', async e => {
  // (registered with capture=true below)
  // Capture-phase early preventDefault for Cmd-shortcuts so Firefox's menu
  // accelerators (Tools/etc.) don't swallow them.
  if ((e.metaKey || e.ctrlKey) &&
      (e.code === 'KeyJ' || e.code === 'KeyD' || e.code === 'KeyI' || e.code === 'KeyX'
       || e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
    e.preventDefault();
  }
  if (e.code === 'Space')        { e.preventDefault(); playing ? doPause() : doPlay(); }
  if (e.metaKey && e.code === 'ArrowLeft')  { e.preventDefault(); doReset(); }
  if (e.metaKey && e.code === 'ArrowRight') { e.preventDefault(); scrollOffset = (totalMeasures - 1) * MEASURE_W; seekToScrollOffset(); }
  if (e.code === 'ArrowRight')   { e.preventDefault(); scrollOffset = Math.min(maxScroll(), scrollOffset + MEASURE_W); snapToBar(); seekToScrollOffset(); }
  if (e.code === 'ArrowLeft')    { e.preventDefault(); scrollOffset = Math.max(0, scrollOffset - MEASURE_W); snapToBar(); seekToScrollOffset(); }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyX') {
    e.preventDefault();
    if (!editMode) return;
    const posStr = await customPrompt('Delete bar number (everything after shifts back):');
    if (posStr === null) return;
    const userBar = parseInt(posStr, 10);
    const pos = userBar - 1;
    if (isNaN(pos) || pos < 0 || pos >= totalMeasures) return;
    if (!(await customConfirm(`Delete bar ${userBar} and all its contents?`))) return;
    pushUndo();
    notes = notes.filter(n => n.measure !== pos);
    stems = stems.filter(s => s.measure !== pos);
    beams = beams.filter(b => Math.floor(b.beat / BEATS_PER_MEASURE) !== pos);
    for (const n of notes) {
      if (n.measure > pos) { n.measure -= 1; n.beat -= BEATS_PER_MEASURE; }
    }
    for (const s of stems) {
      if (s.measure > pos) { s.measure -= 1; s.beat -= BEATS_PER_MEASURE; }
    }
    for (const b of beams) {
      if (Math.floor(b.beat / BEATS_PER_MEASURE) > pos) {
        b.beat -= BEATS_PER_MEASURE;
        b.beat_end -= BEATS_PER_MEASURE;
      }
    }
    totalMeasures -= 1;
    totalBeats = totalMeasures * BEATS_PER_MEASURE;
    noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));
    deselectNote();
    markDirty();
    draw();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyI') {
    e.preventDefault();
    if (!editMode) return;
    const posStr = await customPrompt('Insert NEW bar at position (existing bar there will shift forward):');
    if (posStr === null) return;
    const pos = parseInt(posStr, 10) - 1;
    if (isNaN(pos) || pos < 0 || pos > totalMeasures) return;
    const srcStr = await customPrompt('Optionally copy contents FROM bar (leave blank for empty):');
    let srcNotesCopy = [];
    if (srcStr !== null && srcStr.trim() !== '') {
      const src = parseInt(srcStr, 10) - 1;
      if (isNaN(src) || src < 0 || src >= totalMeasures) return;
      srcNotesCopy = notes.filter(n => n.measure === src).map(n => ({ ...n }));
    }
    pushUndo();
    // Shift everything >= pos forward by 1 measure
    for (const n of notes) {
      if (n.measure >= pos) { n.measure += 1; n.beat += BEATS_PER_MEASURE; }
    }
    for (const s of stems) {
      if (s.measure >= pos) { s.measure += 1; s.beat += BEATS_PER_MEASURE; }
    }
    for (const b of beams) {
      if (Math.floor(b.beat / BEATS_PER_MEASURE) >= pos) {
        b.beat += BEATS_PER_MEASURE;
        b.beat_end += BEATS_PER_MEASURE;
      }
    }
    totalMeasures += 1;
    totalBeats = totalMeasures * BEATS_PER_MEASURE;
    // Add copied source notes at the new bar
    for (const sn of srcNotesCopy) {
      const copy = { ...sn };
      copy.measure = pos;
      copy.beat = pos * BEATS_PER_MEASURE + sn.beat_in_measure;
      notes.push(copy);
    }
    notes.sort((a, b) => a.beat - b.beat || a.string - b.string);
    noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));
    deselectNote();
    markDirty();
    draw();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.code === 'KeyD') {
    e.preventDefault();
    if (!editMode) return;
    const srcStr = await customPrompt('Copy notes FROM bar number:');
    if (srcStr === null) return;
    const src = parseInt(srcStr, 10) - 1;
    const dstStr = await customPrompt('Copy TO bar number (will replace contents):');
    if (dstStr === null) return;
    const dst = parseInt(dstStr, 10) - 1;
    if (isNaN(src) || isNaN(dst) || src < 0 || dst < 0
        || src >= totalMeasures || dst >= totalMeasures || src === dst) return;
    pushUndo();
    // Remove existing notes in destination bar
    notes = notes.filter(n => n.measure !== dst);
    // Copy notes from source bar (deep copy), retarget measure and beat
    const srcNotes = notes.filter(n => n.measure === src);
    const offset = (dst - src) * BEATS_PER_MEASURE;
    for (const n of srcNotes) {
      const copy = { ...n };
      copy.measure = dst;
      copy.beat = n.beat + offset;
      notes.push(copy);
    }
    notes.sort((a, b) => a.beat - b.beat || a.string - b.string);
    noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));
    deselectNote();
    markDirty();
    draw();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.code === 'KeyJ') {
    e.preventDefault();
    const ans = await customPrompt('Jump to bar number:');
    if (ans !== null) {
      const bar = parseInt(ans, 10);
      if (!isNaN(bar) && bar >= 1 && bar <= totalMeasures) {
        scrollOffset = Math.min(maxScroll(), Math.max(0, (bar - 1) * MEASURE_W));
        snapToBar(); seekToScrollOffset();
      }
    }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && (e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
    e.preventDefault();
    const step = e.shiftKey ? 2 : 10;
    const delta = e.code === 'ArrowUp' ? step : -step;
    const v = Math.min(220, Math.max(30, parseInt(bpmSlider.value) + delta));
    bpmSlider.value = v;
    bpmVal.textContent = v;
    if (audioReady) Tone.Transport.bpm.value = v;
    markDirtyNoRebuild();
    return;
  }
  if (e.code === 'Home')         { doReset(); }
  if (e.key  === 'l'||e.key==='L') { toggleLoop(); }
  if (e.code === 'BracketLeft')  { e.preventDefault(); setLoopIn(); }
  if (e.code === 'BracketRight') { e.preventDefault(); setLoopOut(); }
}, true);  // capture phase: run before Firefox's menu-accelerator default

// Canvas drag to pan score (mouseup seeks transport)
// Short stationary press+release = tap = play/pause toggle.
const TAP_MAX_MOVE = 8;     // px
const TAP_MAX_TIME = 300;   // ms
let dragStartX     = null;
let dragStartY     = null;
let dragStartScroll= null;
let dragStartTime  = 0;
let dragMoved      = false;
// Set by touchend whenever it handles a tap, so the synthetic mouseup that
// follows on Android doesn't double-toggle play/pause.
let touchTapAt     = 0;
viewport.addEventListener('mousedown', e => {
  if (e.button !== 0 || editMode) return;
  dragStartX      = e.clientX;
  dragStartY      = e.clientY;
  dragStartScroll = scrollOffset;
  dragStartTime   = Date.now();
  dragMoved       = false;
  viewport.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (dragStartX === null) return;
  const dx = dragStartX - e.clientX;
  if (Math.abs(dx) > TAP_MAX_MOVE || Math.abs(dragStartY - e.clientY) > TAP_MAX_MOVE) dragMoved = true;
  scrollOffset = Math.min(maxScroll(), Math.max(0, dragStartScroll + dx / zoom));
  draw();
});
window.addEventListener('mouseup', e => {
  if (dragStartX === null) return;
  const elapsed = Date.now() - dragStartTime;
  dragStartX = null;
  viewport.style.cursor = '';
  // Ignore synthetic mouseup that fires right after a real touch tap
  if (Date.now() - touchTapAt < 500) return;
  // Tap: short and no movement → toggle play/pause
  if (!dragMoved && elapsed < TAP_MAX_TIME) {
    playing ? doPause() : doPlay();
    return;
  }
  snapToBar();
  seekToScrollOffset();
});

// Snap scrollOffset to the nearest barline (only when not playing)
let snapTimer = null;
function snapToBar() {
  if (playing) return;
  const m = Math.round(scrollOffset / MEASURE_W);
  scrollOffset = Math.min(maxScroll(), Math.max(0, m * MEASURE_W));
  draw();
}
function scheduleSnap() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(snapToBar, 150);
}

// Seek the transport to match current scrollOffset (pauses + resumes if playing)
function seekToScrollOffset() {
  if (!audioReady) return;
  const beat = scrollBeat();
  const wasPlaying = playing;
  if (wasPlaying) {
    Tone.Transport.pause();
    if (sampler) sampler.releaseAll();
    playing = false;
    btnPlay.textContent = '▶ Play';
    if (animId) cancelAnimationFrame(animId);
  }
  Tone.Transport.ticks = Math.round(beat * Tone.Transport.PPQ);
  if (wasPlaying) {
    Tone.Transport.start();
    playing = true;
    btnPlay.textContent = '⏸ Pause';
    animId = requestAnimationFrame(animLoop);
  }
}

// Scroll wheel: horizontal → scroll score, vertical → BPM
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    // Horizontal scroll — move score, snap to bar on settle
    scrollOffset = Math.min(maxScroll(), Math.max(0, scrollOffset + e.deltaX / zoom));
    draw();
    scheduleSnap();
  } else {
    // Vertical scroll — adjust BPM
    const v = parseInt(bpmSlider.value) - Math.round(e.deltaY / 5);
    bpmSlider.value = Math.min(220, Math.max(30, v));
    bpmVal.textContent = bpmSlider.value;
    if (audioReady) Tone.Transport.bpm.value = parseInt(bpmSlider.value);
  }
}, { passive: false });

// Touch drag — scroll score, snap to bar on release. Short stationary touch = tap = play/pause.
let touchStartX     = null;
let touchStartY     = null;
let touchStartScroll= null;
let touchStartTime  = 0;
let touchMoved      = false;
viewport.addEventListener('touchstart', e => {
  if (editMode) return;
  touchStartX      = e.touches[0].clientX;
  touchStartY      = e.touches[0].clientY;
  touchStartScroll = scrollOffset;
  touchStartTime   = Date.now();
  touchMoved       = false;
  clearTimeout(snapTimer);
}, { passive: true });
viewport.addEventListener('touchmove', e => {
  if (touchStartX === null) return;
  const dx = touchStartX - e.touches[0].clientX;
  const dy = touchStartY - e.touches[0].clientY;
  if (Math.abs(dx) > TAP_MAX_MOVE || Math.abs(dy) > TAP_MAX_MOVE) touchMoved = true;
  scrollOffset = Math.min(maxScroll(), Math.max(0, touchStartScroll + dx / zoom));
  draw();
}, { passive: true });
viewport.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const elapsed = Date.now() - touchStartTime;
  touchStartX = null;
  if (!touchMoved && elapsed < TAP_MAX_TIME) {
    touchTapAt = Date.now();
    e.preventDefault();   // suppress synthetic mouse/click that would re-toggle
    playing ? doPause() : doPlay();
    return;
  }
  snapToBar();
  seekToScrollOffset();
});

// ── Edit mode ────────────────────────────────────────────────────────────────
const btnEdit    = document.getElementById('btn-edit');
const btnUndo    = document.getElementById('btn-undo');
const btnSave    = document.getElementById('btn-save');
const editPopup  = document.getElementById('edit-popup');
const fretInput  = document.getElementById('fret-input');
const btnDelNote = document.getElementById('btn-del-note');
const btnHammer  = document.getElementById('btn-hammer');

function toggleEditMode() {
  editMode = !editMode;
  btnEdit.classList.toggle('active', editMode);
  btnEdit.textContent = editMode ? '✎ Editing' : '✎ Edit';
  viewport.style.cursor = editMode ? 'crosshair' : '';
  btnUndo.style.display = editMode ? '' : 'none';
  if (!editMode) { undoStack = []; updateUndoBtn(); }
  deselectNote();
  if (editMode && playing) doPause();
}

function pushUndo() {
  undoStack.push({
    notes: notes.map(n => ({ ...n })),
    stems: stems.map(s => ({ ...s })),
    beams: beams.map(b => ({ ...b })),
  });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  btnUndo.disabled = undoStack.length === 0;
  btnUndo.textContent = undoStack.length ? `↩ Undo (${undoStack.length})` : '↩ Undo';
}

function doUndo() {
  if (!undoStack.length) return;
  const state = undoStack.pop();
  notes = state.notes;
  stems = state.stems;
  beams = state.beams;
  noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));
  deselectNote();
  markDirty();
  updateUndoBtn();
  draw();
}

function deselectNote() {
  selectedNote     = null;
  selectedStemNotes = null;
  fretInput.style.display = '';
  editPopup.style.display = 'none';
  draw();
}

function selectNote(note, canvasSX, canvasSY) {
  selectedNote      = note;
  selectedStemNotes = null;           // clear any stem selection
  fretInput.style.display = '';       // restore if hidden by stem selection
  const popW = 220;
  const x = Math.min(canvasSX - 26, canvas.width  - popW);
  const y = Math.max(canvasSY - 44, 4);
  editPopup.style.left    = x + 'px';
  editPopup.style.top     = y + 'px';
  editPopup.style.display = 'flex';
  fretInput.value = note.fret;
  updateDurButtons();
  fretInput.focus();
  fretInput.select();
  draw();
}

function commitFret() {
  if (!selectedNote) return;
  const val = parseInt(fretInput.value);
  if (!isNaN(val) && val >= 0 && val <= 22 && val !== selectedNote.fret) {
    pushUndo();
    selectedNote.fret = val;
    selectedNote.midi = (window.OPEN_MIDI || [67,62,57,53,48,41])[selectedNote.string] + val;
    markDirty();
  }
  deselectNote();
}

function markDirty() {
  isDirty = true;
  btnSave.style.display = '';
  // Rebuild audio part so edits are heard immediately on next play
  if (notePart) { notePart.dispose(); notePart = null; audioReady = false; btnPlay.disabled = false; }
}
// Lighter version: flag as dirty without tearing down the audio engine
// (use for changes that propagate live, e.g. tempo, swing).
function markDirtyNoRebuild() {
  isDirty = true;
  btnSave.style.display = '';
}

// Hit detection: find stem nearest to sx (within hit radius), ignoring y
function stemAtScreen(sx, sy) {
  const top   = staffTop();
  const sH    = stringH();
  const sTemH = Math.max(8, 18 * zoom);
  // Only register hits ABOVE the top staff line — clicking on the staff itself adds notes
  if (sy < top - sTemH - 10 || sy >= top) return null;
  const hitX = Math.max(6, 9 * zoom);
  let best = null, bestDist = Infinity;
  for (const stem of stems) {
    const dist = Math.abs(sx - vxToSX(beatToVX(stem.beat)));
    if (dist < hitX && dist < bestDist) { bestDist = dist; best = stem; }
  }
  return best;
}

function selectStem(stem, canvasSX, canvasSY) {
  selectedNote      = null;
  selectedStemNotes = notes.filter(n => Math.round(n.beat * 8) === Math.round(stem.beat * 8));
  if (!selectedStemNotes.length) return;
  fretInput.style.display = 'none';   // fret doesn't apply to a multi-note stem
  const popW = 160;
  const stemSX = vxToSX(beatToVX(stem.beat));
  const x = Math.min(stemSX - 20, canvas.width - popW);
  const y = Math.max(4, staffTop() - Math.max(8, 18 * zoom) - 36);
  editPopup.style.left    = x + 'px';
  editPopup.style.top     = y + 'px';
  editPopup.style.display = 'flex';
  updateDurButtons();
  draw();
}

// Hit detection: find note nearest to canvas coords (sx, sy)
function noteAtScreen(sx, sy) {
  const top  = staffTop();
  const sH   = stringH();
  const fs   = Math.max(8, NOTE_FONT * zoom);
  const hitX = fs * 1.5;
  const hitY = Math.min(fs * 1.3, sH * 0.48); // generous but won't bleed onto adjacent string
  let best = null, bestDist = Infinity;
  for (const note of notes) {
    const nx = vxToSX(beatToVX(note.beat));
    const ny = top + note.string * sH;
    if (Math.abs(sx - nx) < hitX && Math.abs(sy - ny) < hitY) {
      const d = Math.hypot(sx - nx, sy - ny);
      if (d < bestDist) { bestDist = d; best = note; }
    }
  }
  return best;
}

// Add a new note by clicking on empty space in edit mode
function addNoteAtScreen(sx, sy) {
  const top = staffTop();
  const sH  = stringH();
  // Nearest string
  let str = 0, minD = Infinity;
  for (let s = 0; s < N_STRINGS; s++) {
    const d = Math.abs(sy - (top + s * sH));
    if (d < minD) { minD = d; str = s; }
  }
  if (minD > sH * 0.6) return;  // too far from any string
  // Nearest beat (snap to 8th note = 0.5 beat)
  const vx   = (sx - cursorX()) / zoom + scrollOffset;
  const beat = Math.round(vx * BEATS_PER_MEASURE / MEASURE_W * 2) / 2;
  if (beat < 0) return;
  const measure = Math.floor(beat / BEATS_PER_MEASURE);
  const bim     = parseFloat((beat % BEATS_PER_MEASURE).toFixed(4));
  const OMIDI   = [67,62,57,53,48,41];
  const newNote = { beat: parseFloat(beat.toFixed(4)), midi: OMIDI[str], string: str,
                    fret: 0, measure, beat_in_measure: bim };
  pushUndo();
  notes.push(newNote);
  notes.sort((a, b) => a.beat - b.beat || a.string - b.string);
  markDirty();
  selectNote(newNote, sx, sy);
}

// Canvas click in edit mode
viewport.addEventListener('click', e => {
  if (!editMode) return;
  if (e.target === fretInput) return;  // fret input handles itself; all buttons use stopPropagation
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const hit = noteAtScreen(sx, sy);

  if (hit) {
    selectNote(hit, sx, sy);
  } else {
    const stemHit = stemAtScreen(sx, sy);
    if (stemHit) {
      selectStem(stemHit, sx, sy);
    } else {
      deselectNote();
      addNoteAtScreen(sx, sy);
    }
  }
});

// Fret input events
fretInput.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); commitFret(); }
  if (e.key === 'Escape') { deselectNote(); }
  e.stopPropagation();  // don't trigger playback shortcuts
});
fretInput.addEventListener('blur', () => { if (selectedNote) commitFret(); });

// Delete selected note via ✕ button or Delete key (when input not focused)
function deleteSelectedNote() {
  if (!selectedNote) return;
  pushUndo();
  notes = notes.filter(n => n !== selectedNote);
  deselectNote();
  markDirty();
}
btnDelNote.addEventListener('mousedown', e => { e.preventDefault(); }); // keep fretInput focused so blur doesn't fire first
btnDelNote.addEventListener('click',     e => { e.stopPropagation(); deleteSelectedNote(); });

btnHammer.addEventListener('mousedown', e => { e.preventDefault(); });
btnHammer.addEventListener('click', e => {
  e.stopPropagation();
  const targets = selectedStemNotes || (selectedNote ? [selectedNote] : null);
  if (!targets) return;
  pushUndo();
  // Toggle: if any target lacks hammer flag, set them all; otherwise clear
  const allOn = targets.every(n => n.hammer);
  targets.forEach(n => { if (allOn) delete n.hammer; else n.hammer = true; });
  updateDurButtons();
  markDirty();
  draw();
});

// Duration buttons
function updateDurButtons() {
  let dur = null;
  if (selectedNote) {
    dur = selectedNote.duration ?? null;  // only highlight if explicitly set
  } else if (selectedStemNotes) {
    const durs = [...new Set(selectedStemNotes.map(n => n.duration ?? null))];
    dur = durs.length === 1 ? durs[0] : null;
  }
  document.querySelectorAll('.dur-btn').forEach(btn => {
    if (btn.id === 'btn-hammer') return;
    btn.classList.toggle('active', btn.dataset.dur === dur);
  });
  // Hammer button active state
  const hammerOn = selectedNote ? !!selectedNote.hammer
                 : selectedStemNotes ? selectedStemNotes.every(n => n.hammer)
                 : false;
  btnHammer.classList.toggle('active', hammerOn);
}

function setDuration(dur) {
  const targets = selectedStemNotes || (selectedNote ? [selectedNote] : null);
  if (!targets) return;
  pushUndo();
  targets.forEach(n => { n.duration = dur; });
  updateDurButtons();
  rebuildStemsAndBeams();
  markDirty();
  draw();
}

function rebuildStemsAndBeams() {
  // Only touch measures that contain at least one note with an explicit duration.
  // All other measures keep their original parsed beams unchanged.
  const explicitMeasures = new Set(
    notes.filter(n => n.duration != null).map(n => n.measure)
  );
  if (explicitMeasures.size === 0) return;

  const durOrder = { t: 0, s: 1, e: 2, q: 3 };

  // Keep beams from unedited measures
  const newBeams = beams.filter(b => !explicitMeasures.has(Math.floor(b.beat / BEATS_PER_MEASURE)));

  // Recompute beams only for explicitly-edited measures
  for (const m of explicitMeasures) {
    const mNotes = notes.filter(n => n.measure === m && !n.grace);
    const beatInfo = new Map();
    for (const note of mNotes) {
      const key = Math.round(note.beat * 8);
      // Notes without an explicit duration are not beamable — treat as quarter
      const dur = note.duration ?? 'q';
      if (!beatInfo.has(key)) {
        beatInfo.set(key, { beat: note.beat, dur });
      } else {
        const info = beatInfo.get(key);
        if ((durOrder[dur] ?? 3) < (durOrder[info.dur] ?? 3)) info.dur = dur;
      }
    }
    const infos = [...beatInfo.values()].sort((a, b) => a.beat - b.beat);
    let i = 0;
    while (i < infos.length) {
      if (infos[i].dur === 'q') { i++; continue; }
      const groupStart = i;
      let j = i + 1;
      while (j < infos.length && infos[j].dur !== 'q') j++;
      if (j - groupStart >= 2) {
        for (let k = groupStart; k < j - 1; k++) {
          newBeams.push({ beat: infos[k].beat, beat_end: infos[k + 1].beat, level: 1 });
          if (infos[k].dur === 's' && infos[k + 1].dur === 's')
            newBeams.push({ beat: infos[k].beat, beat_end: infos[k + 1].beat, level: 2 });
        }
      }
      i = j;
    }
  }

  beams = newBeams;
  noteStemSet = new Set(notes.filter(n => !n.grace).map(n => Math.round(n.beat * 8)));
}

document.querySelectorAll('.dur-btn').forEach(btn => {
  if (btn.id === 'btn-hammer') return;   // hammer button has its own click handler
  btn.addEventListener('mousedown', e => { e.preventDefault(); }); // prevent blur on fretInput
  btn.addEventListener('click', e => { e.stopPropagation(); setDuration(btn.dataset.dur); });
});

document.addEventListener('keydown', e => {
  if (!editMode || !selectedNote) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement !== fretInput) {
    deleteSelectedNote();
  }
});

// Save: POST to local server (in-place write), fallback to download
async function doSave() {
  const out = {
    bpm: parseInt(bpmSlider.value),
    total_measures: totalMeasures,
    open_midi: [67,62,57,53,48,41],
    notes,
    stems,
    beams,
  };
  const body = JSON.stringify(out);
  const filename = `${currentScoreId || 'score'}.json`;
  try {
    const r = await fetch(`/save?id=${encodeURIComponent(currentScoreId || '')}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    if (!r.ok) throw new Error(r.status);
    isDirty = false;
    btnSave.textContent = '✔ Saved';
    setTimeout(() => { btnSave.textContent = '⬇ Save'; }, 1500);
  } catch {
    // Not running locally — fall back to download
    const blob = new Blob([body], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    isDirty = false;
  }
}

btnEdit.addEventListener('click', toggleEditMode);
btnUndo.addEventListener('click', doUndo);
btnSave.addEventListener('click', doSave);

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (isDirty) doSave(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); if (editMode) doUndo(); }
});

// ── Resize
function resize() {
  canvas.width  = viewport.clientWidth;
  canvas.height = viewport.clientHeight;
  draw();
}
window.addEventListener('resize', resize);
resize();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
    // Check for updated SW on every page load
    reg.update();
    // When a new SW takes over, auto-reload once so the fresh assets show
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>
