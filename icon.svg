<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1a1a1a"/>
  <!-- Guitar body -->
  <ellipse cx="256" cy="330" rx="110" ry="130" fill="none" stroke="#e8a020" stroke-width="18"/>
  <ellipse cx="256" cy="300" rx="72" ry="88" fill="none" stroke="#e8a020" stroke-width="12"/>
  <!-- Neck -->
  <rect x="242" y="100" width="28" height="160" rx="8" fill="#e8a020"/>
  <!-- Headstock -->
  <rect x="230" y="70" width="52" height="42" rx="8" fill="#e8a020"/>
  <!-- Sound hole -->
  <circle cx="256" cy="320" r="32" fill="#1a1a1a" stroke="#e8a020" stroke-width="8"/>
  <!-- Strings -->
  <line x1="256" y1="100" x2="256" y2="420" stroke="#c8a060" stroke-width="2" opacity="0.5"/>
</svg>
